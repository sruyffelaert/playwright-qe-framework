name: Playwright Tests
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      env:
        TEST_ENV: SIT
        PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      run: npx playwright test --project=chromium --workers=1 --retries=1 --grep-invert "@local-only" --reporter=line,html,json
    - name: Publish test summary
      if: ${{ !cancelled() }}
      run: |
        if [ -f results.json ]; then
          jq -r '.stats | "## Playwright Results\n| Result | Count |\n|---|---:|\n| Passed | \(.expected) |\n| Failed | \(.unexpected) |\n| Flaky | \(.flaky) |\n| Skipped | \(.skipped) |"' results.json >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No test results generated." >> "$GITHUB_STEP_SUMMARY"
        fi
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30